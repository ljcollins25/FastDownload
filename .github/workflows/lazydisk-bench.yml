name: Lazy disk bench

# Thin caller on the default branch, so "Run workflow" works with main selected. The real workflow lives on the
# lazydisk-bench branch and is called at that ref; changes there take effect without touching main.
on:
  workflow_dispatch:
    inputs:
      workload:
        description: "Workload (selftest | serilog | runtime-libs | runtime-clr-libs)"
        default: selftest
        type: choice
        options: [selftest, serilog, runtime-libs, runtime-clr-libs]
      variants:
        description: "Comma separated: native,fd,lazy,lazyfd"
        default: "native,fd,lazy,lazyfd"
        type: string

permissions:
  contents: read

jobs:
  bench:
    uses: ljcollins25/FastDownload/.github/workflows/lazydisk-bench.yml@lazydisk-bench
    with:
      workload: ${{ inputs.workload }}
      variants: ${{ inputs.variants }}
      ref: lazydisk-bench
