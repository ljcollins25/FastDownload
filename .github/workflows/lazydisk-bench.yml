name: Lazy disk bench

# Stub on the default branch so the workflow can be dispatched (GitHub only offers "Run workflow" for workflows that
# exist on the default branch). The real workflow lives on the lazydisk-bench branch: run it with "Use workflow from:
# lazydisk-bench", or `gh workflow run lazydisk-bench.yml --ref lazydisk-bench -f workload=serilog`.
on:
  workflow_dispatch:
    inputs:
      workload:
        description: "Workload (selftest | serilog | runtime-libs | runtime-clr-libs)"
        default: selftest
        type: choice
        options: [selftest, serilog, runtime-libs, runtime-clr-libs]
      variants:
        description: "Comma separated: native,fd,lazy,lazyfd"
        default: "native,fd,lazy,lazyfd"
        type: string

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
    - name: Use the lazydisk-bench branch
      run: |
        echo "::error::This is a stub. Run the workflow from the lazydisk-bench branch (Use workflow from: lazydisk-bench)."
        exit 1
